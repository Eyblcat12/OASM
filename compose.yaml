name: oasm-ti-siem-test

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-database: &database
  POSTGRES_HOST: postgres
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_PORT: "5432"
  POSTGRES_DB: open_asm
  POSTGRES_SSL: "false"

services:
  console:
    image: local/oasm-console:poc-2e12e49
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:6276:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./branding/ncs-oasm-icon.png:/usr/share/nginx/html/logo.png:ro
      - ./branding/ncs-oasm-wordmark.png:/usr/share/nginx/html/ncs-oasm-wordmark.png:ro
    depends_on:
      core-api:
        condition: service_healthy
    logging: *bounded-logging

  core-api:
    image: local/oasm-api:poc-2e12e49
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      <<: *database
      PORT: "6277"
      BASE_URL: ${BASE_URL:-http://localhost:6276}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OASM_CLOUD_APIKEY: ${OASM_CLOUD_APIKEY:?set OASM_CLOUD_APIKEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?retrieve original ENCRYPTION_KEYS securely}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      GEO_IP_URL: geo-ip-database:4360
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      AUDIT_ARCHIVE_DIR: /app/audit-archive
    volumes:
      - ./runtime-overrides/connectors.nuclei-60m.json:/app/resources/connectors/manifest.json:ro
      - audit-archive:/app/audit-archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
      geo-ip-database:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6277/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *bounded-logging

  migration:
    image: local/oasm-api:poc-2e12e49
    pull_policy: never
    environment: *database
    command: ["sh", "-c", "npx typeorm migration:run -d dist/database/database-config.js"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *bounded-logging

  postgres:
    image: postgres@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: open_asm
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "open_asm"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *bounded-logging

  redis:
    image: redis@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *bounded-logging

  rustfs:
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
    command: ["/data"]
    volumes:
      - rustfs-data:/data
    logging: *bounded-logging

  geo-ip-database:
    image: ghcr.io/oasm-platform/dbip@sha256:e4e92a7958f9b9861c1ae9206fe9d96343aa270fbf7e99c0a48348a0564d2e8d
    restart: unless-stopped
    platform: linux/amd64
    volumes:
      - geoip-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4360"]
      interval: 5s
      timeout: 5s
      retries: 24
    logging: *bounded-logging

volumes:
  pgdata18:
  redis-data:
  rustfs-data:
  geoip-data:
  audit-archive:
